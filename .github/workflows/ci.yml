name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: tests/requirements-dev.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements-dev.txt
      - name: 语法编译
        run: python -m py_compile $(find app/src/main/python -name "*.py")
      - name: 单元测试
        run: python -m pytest tests -q

  frontend:
    name: 前端语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --check
        run: python tools/check_js.py

  android:
    name: 安卓编译（可选）
    runs-on: ubuntu-latest
    # Chaquopy + Android SDK 环境较重，只在手动触发时跑
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: 构建 debug APK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
